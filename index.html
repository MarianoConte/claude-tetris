<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry hidden">
          <label for="name-input">¡Nuevo récord! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Anónimo" />
            <button id="save-btn" type="button">Guardar</button>
          </div>
        </div>
        <button id="restart-btn">Jugar</button>
        <div id="records-panel" class="records-panel hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table id="records-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th><th>Fecha</th></tr></thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="stats-line" class="stats-line"></p>
          <div class="clear-row">
            <button id="clear-btn" type="button" class="link-btn">Borrar records</button>
            <span id="clear-confirm" class="hidden">¿Seguro?
              <button id="clear-yes" type="button" class="link-btn">Sí</button>
              <button id="clear-no" type="button" class="link-btn">No</button>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
